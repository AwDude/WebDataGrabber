<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8"/>
	<title>Web Data Grabber</title>
	<link rel="stylesheet" href="main.css">
	<script type="text/javascript" src="main.js"></script>
</head>
<body>
	<div id="overlay">
		<div id="dialog">
			<div>
				<input type="radio" id="click" name="action" value="click" checked>
				<label for="click">Click</label><br>
				<input type="radio" id="grab" name="action" value="grab">
				<label for="grab">Grab Text</label><br>
			</div>
			<div>
				<input type="checkbox" id="multiple" name="multiple">
				<label for="multiple">Repeat for similar elements</label>
			</div>
			<div id="dialog-button-container">
				<button class="dialog-button" onclick="dismissDialog()">Abort</button>
				<button class="dialog-button" onclick="saveStep()">Save</button>
			</div>
		</div>
	</div>
	<div id="container">
		<div id="grabber" class="box">
			<h2 class="headline">Steps</h2>
			<ol id="steps"> </ol>
			<button id="record-btn" onclick="toggleRecord()">Record Steps</button>
			<button id="run-btn" onclick="run()">Run</button>
		</div>
		<div id="dragbar"></div>
		<div id="browser" class="box">
			<div id="browser_head" class="header">
				<input type="text" id="url" onkeypress="return onUrlEntered(event)">
			</div>
			<iframe id="website" nwdisable nwfaketop onload="onWebsiteLoaded()"></iframe>
		</div>
	</div>
</body>
</html>
